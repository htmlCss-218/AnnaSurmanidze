<html>
    <head>
        <meta name="viewport" content="width-device-width, initial-scale=1.0" > 
        
    <style>
       @media screen and (max-width: 767px) {
        body { background-color: rgb(36, 35, 56)} }
        @media screen and (max-width: 768px) {
        body {background-color:rgb(36, 35, 56);}  }
        @media screen and (min-width: 1024px) {
        body {background-color:rgb(36, 35, 56); } }


        .registration {display: inline-block;
            justify-content: center;
            font-size: 25px;
            background-color: rgb(66, 66, 112);
            color: antiquewhite;
            margin-left: 33%;
            margin-top: 11%;
            border-radius: 5px;
            box-shadow: 12px 12px 18px 18px #3300ff49;
            width: 35%;
            text-align: center;

        }
        .button2 {
            background-color:rgb(107, 50, 241);
            border-radius: 5px;
            color: rgb(226, 160, 160);
            padding: 15px 32px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
    </style>
         <link rel="stylesheet" href="mainstyle.css">
    </head>
    <body>
        <header>
           <br><br> <H1> Discover the Universe, One Star at a Time </H1> <br><br>
        </header>
        <main>
            <main>
        
            <div class="registration">
                <p> Registration: </p> <br><br>
                
                <label for="flname">First name/Last name:</label> <br>
                <input type="text" id="flname" name="flname"><br><br>
                <label for="Email">Email:</label><br>
                <input type="text" id="Email" name="Email"><br><br>
                <label for="phone">Phone:</label> <br>
                <input type="text" id="phone" name="phone"><br><br>
                <p> Registration type: </p>
               <input type="radio" id="bussines" name="business" value="business">
               <label for="business">Bussines</label><br>
               <input type="radio" id="education" name="education" value="education">
               <label for="education">Education</label><br>  
               <input type="radio" id="student" name="student" value="student">
               <label for="student">Student</label><br>
               <input type="radio" id="other" name="other" value="other">
               <label for="other">Other</label><br><br>
               <input class="button2" type="submit" value="Submit">
            </div>
        </main>
        <footer>
            <p> 2024 Galaxy Explorers. All rights reserved. </p>
        </footer>
    </body>
</html>
